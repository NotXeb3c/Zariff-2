name: Build Zariff for Windows


on:
  workflow_dispatch:
  push:
    branches:
      - main


permissions:
  contents: read


jobs:
  build-windows:
    runs-on: windows-latest


    steps:
      - name: Checkout Zariff
        uses: actions/checkout@v4


      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tauri-app/package-lock.json


      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc


      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "tauri-app/src-tauri -> target"


      - name: Install frontend dependencies
        working-directory: tauri-app
        run: npm ci


      - name: Build Zariff
        working-directory: tauri-app
        run: npm run tauri build


      - name: Upload Zariff EXE
        uses: actions/upload-artifact@v4
        with:
          name: Zariff-Windows
          path: |
            tauri-app/src-tauri/target/release/zariff.exe
            tauri-app/src-tauri/target/release/bundle/nsis/*.exe
            tauri-app/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
